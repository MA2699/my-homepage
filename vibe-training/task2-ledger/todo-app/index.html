<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办事项</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; justify-content: center; padding: 40px 16px;
  }
  .app { width: 100%; max-width: 520px; }
  h1 { color: #fff; text-align: center; margin-bottom: 24px; font-weight: 600; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,.2);
  }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1; padding: 12px 14px; border: 2px solid #e5e7eb; border-radius: 10px;
    font-size: 15px; outline: none; transition: border-color .2s;
  }
  input[type="text"]:focus { border-color: #667eea; }
  button.add {
    padding: 12px 20px; background: #667eea; color: #fff; border: none;
    border-radius: 10px; font-size: 15px; cursor: pointer; transition: background .2s;
  }
  button.add:hover { background: #5568d3; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; }
  .filters button {
    flex: 1; padding: 8px; border: 1px solid #e5e7eb; background: #f9fafb;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: #4b5563;
  }
  .filters button.active { background: #667eea; color: #fff; border-color: #667eea; }
  ul { list-style: none; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 12px 8px;
    border-bottom: 1px solid #f3f4f6; animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }
  li input[type="checkbox"] { width: 18px; height: 18px; accent-color: #667eea; cursor: pointer; }
  li .text { flex: 1; font-size: 15px; word-break: break-all; }
  li.done .text { text-decoration: line-through; color: #9ca3af; }
  li .del {
    border: none; background: none; color: #ef4444; font-size: 18px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; opacity: .6;
  }
  li .del:hover { opacity: 1; background: #fee2e2; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 13px; color: #6b7280; }
  .footer button { border: none; background: none; color: #6b7280; cursor: pointer; text-decoration: underline; font-size: 13px; }
  .empty { text-align: center; color: #9ca3af; padding: 32px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <h1>📝 待办事项</h1>
  <div class="card">
    <form id="form">
      <input type="text" id="input" placeholder="添加一个新任务..." autocomplete="off" required>
      <button type="submit" class="add">添加</button>
    </form>
    <div class="filters">
      <button data-filter="all" class="active">全部</button>
      <button data-filter="active">未完成</button>
      <button data-filter="done">已完成</button>
    </div>
    <ul id="list"></ul>
    <div class="footer">
      <span id="count"></span>
      <button id="clear">清除已完成</button>
    </div>
  </div>
</div>

<script>
const KEY = 'todos';
let todos = JSON.parse(localStorage.getItem(KEY) || '[]');
let filter = 'all';

const $ = id => document.getElementById(id);

function save() { localStorage.setItem(KEY, JSON.stringify(todos)); }

function render() {
  const shown = todos.filter(t =>
    filter === 'all' ? true : filter === 'done' ? t.done : !t.done);
  $('list').innerHTML = shown.length ? '' : '<div class="empty">暂无事项</div>';
  for (const t of shown) {
    const li = document.createElement('li');
    if (t.done) li.classList.add('done');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.done;
    cb.onchange = () => { t.done = cb.checked; save(); render(); };
    const span = document.createElement('span');
    span.className = 'text'; span.textContent = t.text;
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = '删除';
    del.onclick = () => { todos = todos.filter(x => x.id !== t.id); save(); render(); };
    li.append(cb, span, del);
    $('list').appendChild(li);
  }
  const left = todos.filter(t => !t.done).length;
  $('count').textContent = `共 ${todos.length} 项，未完成 ${left} 项`;
}

$('form').onsubmit = e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  todos.unshift({ id: Date.now(), text, done: false });
  $('input').value = '';
  save(); render();
};

document.querySelectorAll('.filters button').forEach(btn => {
  btn.onclick = () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b === btn));
    render();
  };
});

$('clear').onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };

render();
</script>
</body>
</html>
